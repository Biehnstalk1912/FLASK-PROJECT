<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Orders Dashboard</title>
    <link rel="stylesheet" href={{ url_for('static', filename='style.css') }}>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="dashboard">
        <div class="card">
            <h2>Filter States</h2>
            <button id="toggleAll" class="btn-toggle">Deselect All</button>
            <div id="stateCheckboxes" class="filter-list"></div>
        </div>
        <div class="card chart-card">
            <h2>Order Quantity by State</h2>
            <div class="chart-wrapper">
                <canvas id="myChart"></canvas>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
    const ctx = document.getElementById('myChart').getContext('2d');
    const container = document.getElementById('stateCheckboxes');
    const toggleBtn = document.getElementById('toggleAll');

    function createGradient() {
        const g = ctx.createLinearGradient(0, 0, 0, 400);
        g.addColorStop(0, 'rgba(96, 165, 250, 0.9)');
        g.addColorStop(1, 'rgba(59, 130, 246, 0.4)');
        return g;
    }

    let allData = [];
    const deselected = new Set();

    const chart = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: [],
            datasets: [{
                label: 'Quantity',
                data: [],
                backgroundColor: createGradient(),
                borderColor: 'rgba(96, 165, 250, 1)',
                borderWidth: 1,
                borderRadius: 6,
                borderSkipped: false
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            animation: { duration: 600, easing: 'easeOutQuart' },
            plugins: {
                legend: { display: false },
                tooltip: {
                    backgroundColor: '#1e293b',
                    titleColor: '#e2e8f0',
                    bodyColor: '#94a3b8',
                    borderColor: '#334155',
                    borderWidth: 1,
                    cornerRadius: 8,
                    padding: 12
                }
            },
            scales: {
                y: {
                    beginAtZero: true,
                    grid: { color: 'rgba(51, 65, 85, 0.5)' },
                    ticks: { color: '#94a3b8' }
                },
                x: {
                    grid: { display: false },
                    ticks: { color: '#94a3b8' }
                }
            }
        }
    });

    function updateChart() {
        const filtered = allData.filter(r => !deselected.has(r.State));
        chart.data.labels = filtered.map(r => r.State);
        chart.data.datasets[0].data = filtered.map(r => r.Quantity);
        chart.update();
    }

    function syncToggleButton() {
        const checks = container.querySelectorAll('input[type="checkbox"]');
        const allChecked = Array.from(checks).every(cb => cb.checked);
        toggleBtn.textContent = allChecked ? 'Deselect All' : 'Select All';
    }

    toggleBtn.addEventListener('click', () => {
        const checks = container.querySelectorAll('input[type="checkbox"]');
        const allChecked = Array.from(checks).every(cb => cb.checked);
        if (allChecked) {
            allData.forEach(r => deselected.add(r.State));
        } else {
            deselected.clear();
        }
        syncToggleButton();
        updateChart();
    });

    const source = new EventSource('/stream');

    source.onmessage = function(e) {
        allData = JSON.parse(e.data).sort((a, b) => a.State.localeCompare(b.State));

        container.innerHTML = '';
        allData.forEach((row) => {
            const label = document.createElement('label');
            label.className = 'filter-item';

            const cb = document.createElement('input');
            cb.type = 'checkbox';
            cb.checked = !deselected.has(row.State);
            cb.addEventListener('change', () => {
                if (cb.checked) {
                    deselected.delete(row.State);
                } else {
                    deselected.add(row.State);
                }
                syncToggleButton();
                updateChart();
            });

            const span = document.createElement('span');
            span.textContent = row.State;

            label.appendChild(cb);
            label.appendChild(span);
            container.appendChild(label);
        });

        syncToggleButton();
        updateChart();
    };
    </script>
</body>
</html>
